# global configs
embedding_model: sentence-transformers/all-MiniLM-L6-v2
# Keep this off the GPUs: on a node serving vLLM they are all the server's.
embedding_device: cpu

# env configs
alfworld:
  env_config_path: tasks/env_configs/alfworld_config.yaml
  # Not 30 like most. At 30 every arm of the calibration exhausted the budget -
  # mean_trials 27.6 to 28.8 - and all ten solved the same two tasks of twenty,
  # so the sweep could not have separated them. 50 is ALFWorld's own default in
  # alfworld_config.yaml, and what ReAct and Reflexion use.
  max_steps: 50
  few_shots_num: 1

babyai:
  env_config_path: tasks/env_configs/babyai_config.yaml
  max_steps: 30
  few_shots_num: 1

jericho:
  env_config_path: tasks/env_configs/jericho_config.yaml
  # Not 30 like the others. At 30 moves, seven of the 56 games cannot score at
  # all even for a perfect player following their own walkthrough, and only two
  # are winnable; at 100 no game is stuck on zero and 19 are winnable. See the
  # Jericho section of data/data.md.
  max_steps: 100
  few_shots_num: 1

sciworld:
  env_config_path: tasks/env_configs/sciworld_config.yaml
  max_steps: 30
  few_shots_num: 0

fever:
  env_config_path: tasks/env_configs/fever_config.yaml
  max_steps: 30
  few_shots_num: 3
  max_tasks: 200

hotpotqa:
  env_config_path: tasks/env_configs/hotpotqa_config.yaml
  max_steps: 30
  few_shots_num: 3
  max_tasks: 200

pddl:
  env_config_path: tasks/env_configs/pddl_config.yaml
  max_steps: 30
  few_shots_num: 1

# MAS configs. Looked up by --mas_type, so `graph` below is never read: MacNet's
# mas_type is `macnet`.
autogen:
  autogen:  True
  use_validator: False

graph:
  graph_type: Random
  node_num: 3
  use_critic: False

dylan:
  node_num: 2
  round_num: 2
  learning_rate: 0.01
  use_critic: False
